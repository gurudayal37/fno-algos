name: Update Strategy Backtests

# Runs daily Mon-Fri after market close (4:30pm IST = 11:00 UTC).
#
# We do NOT hard-code Tue/Thu as expiry days — that breaks on NSE holidays
# when expiry shifts to the prior trading day (e.g. Monday on Holi week).
# Instead, the shell script compares the latest expiry in DuckDB against
# what is already exported in the web JSON; it only re-runs backtests when
# a genuinely new expiry date has been downloaded.
#
# IMPORTANT: runs-on: self-hosted  ← must be your Mac.
# The DuckDB options file is 588MB and lives locally; cloud runners cannot
# access it. See the self-hosted runner setup section below.
on:
  schedule:
    - cron: '0 11 * * 1-5'   # Mon-Fri 16:30 IST (11:00 UTC)
  workflow_dispatch:
    inputs:
      force:
        description: 'Set to "true" to skip the new-expiry check and force a full re-run'
        required: false
        default: 'false'

jobs:
  update-backtests:
    runs-on: self-hosted

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python environment
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          pip install -q -r requirements.txt

      - name: Run strategy update script
        env:
          DHAN_CLIENT_ID:   ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN:         ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
          DATABASE_URL:     ${{ secrets.DATABASE_URL }}
          FORCE_UPDATE:     ${{ github.event.inputs.force || 'false' }}
          DUCKDB_PATH:      ${{ secrets.DUCKDB_PATH }}
          SCRIP_MASTER_PATH: ${{ secrets.SCRIP_MASTER_PATH }}
        run: bash scripts/update_strategies.sh

      - name: Commit and push updated web data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add web/data/strategies/

          if git diff --cached --quiet; then
            echo "No strategy data changed — nothing to commit."
            exit 0
          fi

          EXPIRY_DATE=$(date +%Y-%m-%d)
          git commit -m "chore: update strategy backtests for expiry $EXPIRY_DATE [skip ci]"
          git push origin main

# ── Self-hosted runner setup (one-time, on your Mac) ─────────────────────────
#
# 1. Go to: github.com/<your-repo>/settings/actions/runners
#    → "New self-hosted runner" → macOS
#
# 2. Follow the download + configure steps shown there. When asked for labels,
#    add: self-hosted,macOS
#
# 3. Install as a background service so it survives reboots:
#      cd ~/actions-runner
#      ./svc.sh install
#      ./svc.sh start
#
# 4. Add these repository secrets (Settings → Secrets → Actions):
#      DHAN_CLIENT_ID    ← your Dhan client ID
#      DHAN_PIN          ← your Dhan login PIN (same value as in data-syncer secrets)
#      DHAN_TOTP_SECRET  ← TOTP seed from Dhan 2FA (same value as in data-syncer secrets)
#      DATABASE_URL      ← Postgres RDS connection string (for the web app)
#
# 5. The runner needs Python + dependencies available in PATH.
#    If you use a virtualenv, place it at <repo>/.venv — the script activates it.
